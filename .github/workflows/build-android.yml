name: Build Zangetsu Android TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv:
    name: Build Official TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android TV Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare TV Release Assets
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/Zangetsu-v2.3.2-tv-arm32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Zangetsu-v2.3.2-tv-arm64.apk

      - name: Create TV Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zangetsu-tv-build-${{ github.run_number }}
          name: Zangetsu TV Release #${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            dist/Zangetsu-v2.3.2-tv-arm32.apk
            dist/Zangetsu-v2.3.2-tv-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
